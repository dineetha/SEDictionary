<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SE Dictionary</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<header class="header">
  <img src="img/icon32.png" alt="" class="logo">
  <span class="title">SE Dictionary</span>
  <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
</header>

<div class="search-wrap">
  <div class="search-row">
    <span class="search-icon" aria-hidden="true">🔍</span>
    <input id="search-input"
           type="text"
           placeholder="English or සිංහල…"
           autocomplete="off"
           spellcheck="false"
           aria-label="Search word">
    <span id="lang-tag" aria-hidden="true"></span>
    <button id="clear-btn" class="icon-btn" title="Clear" aria-label="Clear search" style="display:none">✕</button>
  </div>
</div>

<div id="results" role="region" aria-live="polite" aria-label="Search results"></div>

<footer class="footer">SE Dictionary &nbsp;·&nbsp; Sinhala–English</footer>

<script src="popup.js"></script>
</body>
</html>
